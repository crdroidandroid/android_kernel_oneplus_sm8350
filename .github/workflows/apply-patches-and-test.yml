name: Apply Patches with Fuzzy Matching

on:
  push:
    branches:
      - 16.0-test
    paths:
      - 'patches/**'
      - '.github/workflows/apply-patches-and-test.yml'
  pull_request:
    branches:
      - 16.0-test
  workflow_dispatch:

jobs:
  apply-patches-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 16.0-test

      - name: List patches
        run: |
          echo "=== Patches to apply ==="
          ls -lah patches/
          echo ""
          echo "=== Patch contents preview ==="
          for patch in patches/*.patch; do
            echo "File: $patch"
            head -20 "$patch"
            echo "---"
          done

      - name: Apply patches with fuzzy matching
        run: |
          set -e
          echo "=== Applying patches with fuzzy matching ==="
          for patch in patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying: $patch"
              
              # Try strict patch first
              if git apply --check "$patch" 2>/dev/null; then
                echo "✓ Strict patch check passed"
                git apply "$patch"
                echo "✓ Applied: $patch (strict mode)"
              else
                echo "⚠ Strict patch failed, trying fuzzy matching..."
                
                # Try with fuzz factor
                if patch -p1 --dry-run <"$patch" 2>/dev/null; then
                  patch -p1 <"$patch"
                  echo "✓ Applied: $patch (fuzzy mode)"
                else
                  echo "ERROR: Could not apply patch $patch with any method"
                  echo "Showing patch context:"
                  head -50 "$patch"
                  exit 1
                fi
              fi
            fi
          done
          echo ""
          echo "=== All patches applied successfully ==="

      - name: Check patch results
        run: |
          echo "=== Modified files ==="
          git diff --name-only
          echo ""
          echo "=== Diff summary ==="
          git diff --stat
          echo ""
          echo "=== Full diff preview ==="
          git diff | head -100

      - name: Verify SYSVIPC patch was applied
        run: |
          echo "=== Checking SYSVIPC patch application ==="
          if grep -q "ANDROID_KABI_USE(6, struct sysv_sem" include/linux/sched.h; then
            echo "✓ SYSVIPC patch applied successfully"
            grep -A 5 "CONFIG_SYSVIPC" include/linux/sched.h | head -20
          else
            echo "⚠ SYSVIPC patch may not have been applied"
            grep -A 10 "struct nameidata" include/linux/sched.h | head -20
          fi

      - name: Verify kernel configuration
        run: |
          echo "=== Checking kernel build files ==="
          ls -lah Makefile Kbuild Kconfig build.config.* 2>/dev/null || true
          echo ""
          echo "=== Kernel version ==="
          head -5 Makefile | grep -E "VERSION|PATCHLEVEL|SUBLEVEL" || echo "Not found in standard location"

      - name: Create summary
        if: always()
        run: |
          echo "## Patch Application Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Applied Patches" >> $GITHUB_STEP_SUMMARY
          ls -1 patches/*.patch | while read patch; do
            echo "- $(basename $patch)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Modified Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --name-only || echo "No changes detected"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Changed Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --stat || echo "No stats available"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
